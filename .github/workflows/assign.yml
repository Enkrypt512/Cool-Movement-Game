name: Assign Issue Bot

on:
  issue_comment:
    types: [created]

jobs:
  assign:
    if: startsWith(github.event.comment.body, '/take') || startsWith(github.event.comment.body, '/assign')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            const comment = context.payload.comment.body.trim();
            const commenter = context.actor;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const issueNumber = context.issue.number;
            let permissionLevel = 'none';
            try {
              const permResponse = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: repoOwner,
                repo: repoName,
                username: commenter
              });
              permissionLevel = permResponse.data.permission;
            } catch (err) {
              console.log(`Error checking permission: ${err.message}`);
            }
            const allowedRoles = ['admin', 'write', 'triage'];
            const isAuthorized = allowedRoles.includes(permissionLevel);
            if (!isAuthorized) {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                body: `Only repository maintainers and collaborators with write/triage privileges can use assignment commands.`
              });
              return;
            }
            const parts = comment.split(/\s+/);
            let targetUser = commenter;
            if (parts.length > 1 && parts[1]) {
              targetUser = parts[1].replace('@', '');
            }
            try {
              await github.rest.issues.addAssignees({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                assignees: [targetUser]
              });
            } catch (error) {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                body: `Could not assign @${targetUser}. Make sure the username is spelled correctly.`
              });
            }
