name: Godot Check Bot

on:
  issue_comment:
    types: [created]

jobs:
  check-permissions:
    name: Check User Permissions
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/gdcheck')
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.perm-check.outputs.authorized }}
    steps:
      - uses: actions/github-script@v6
        id: perm-check
        with:
          script: |
            const commenter = context.actor;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const issueNumber = context.issue.number;

            let permissionLevel = 'none';
            try {
              const permResponse = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: repoOwner,
                repo: repoName,
                username: commenter
              });
              permissionLevel = permResponse.data.permission;
            } catch (err) {
              console.log(`Error checking permission: ${err.message}`);
            }

            const allowedRoles = ['admin', 'write', 'triage'];
            const isAuthorized = allowedRoles.includes(permissionLevel);

            if (!isAuthorized) {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                body: `Only repository maintainers and collaborators with write/triage privileges can run the \`/gdcheck\` command.`
              });
              core.setOutput('authorized', 'false');
              return;
            }

            core.setOutput('authorized', 'true');

  lint-and-format:
    name: GDScript Lint & Format
    needs: check-permissions
    if: needs.check-permissions.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install gdtoolkit
        run: pip install gdtoolkit

      - name: Run gdlint
        run: gdlint .

      - name: Run gdformat check
        run: gdformat --check .

  build-check:
    name: Godot Export Check
    needs: check-permissions
    if: needs.check-permissions.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot Headless Export Test
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.8&flavor=dev4&slug=linux.x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.8&flavor=dev4&slug=export_templates.tpz&platform=templates
          relative_project_path: ./
          archive_output: false
