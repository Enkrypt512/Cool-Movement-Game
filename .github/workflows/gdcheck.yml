name: Godot Check Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  issue_comment:
    types: [created]

jobs:
  Check_Permissions:
    name: Check User Permissions
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/gdcheck')
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.Permission_Check.outputs.authorized}}
      Pull_Request_Secure_Hash_Algorithm: ${{ steps.Permission_Check.outputs.Pull_Request_Secure_Hash_Algorithm}}
    steps:
      - uses: actions/github-script@v6
        id: Permission_Check
        with:
          script: |
            const Commenter = context.actor;
            const Repository_Owner = context.repo.owner;
            const Repository_Name = context.repo.repo;
            const Issue_Number = context.issue.number;
            let permissionLevel = 'none';
            try {
              const Permission_Response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: Repository_Owner,
                repo: Repository_Name,
                username: Commenter
              });
              permissionLevel = Permission_Response.data.permission;
            } catch (Error) {
              console.log(`Error checking permission: ${Error.message}`);
            }
            const Allowed_Roles = ['admin', 'write', 'triage'];
            const Is_Authorized = Allowed_Roles.includes(permissionLevel);
            if (!Is_Authorized) {
              await github.rest.issues.createComment({
                owner: Repository_Owner,
                repo: Repository_Name,
                issue_number: Issue_Number,
                body: `Only repository maintainers and collaborators with write/triage privileges can run the \`/gdcheck\` command.`
              });
              core.setOutput('authorized', 'false');
              return;
            }
            const Pull_Request = await github.rest.pulls.get({
              owner: Repository_Owner,
              repo: Repository_Name,
              pull_number: Issue_Number
            });
            core.setOutput('authorized', 'true');
            core.setOutput('Pull_Request_Secure_Hash_Algorithm',Pull_Request.data.head.sha);

  Lint_And_Format_Check:
    name: GDScript Lint & Format Check
    needs: Check_Permissions
    if: |
      always() && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && needs.Check_Permissions.outputs.authorized == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && needs.Check_Permissions.outputs.Pull_Request_Secure_Hash_Algorithm || github.sha}}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install gdtoolkit
        run: pip install gdtoolkit
      - name: Run gdlint
        run: gdlint .
      - name: Run gdformat check
        run: gdformat --check .

  Build_Check:
    name: Godot Export Check
    needs: Check_Permissions
    if: |
      always() && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && needs.Check_Permissions.outputs.authorized == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && needs.Check_Permissions.outputs.Pull_Request_Secure_Hash_Algorithm || github.sha }}
      - name: Godot Headless Export Test
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.8&flavor=dev4&slug=linux.x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.8&flavor=dev4&slug=export_templates.tpz&platform=templates
          relative_project_path: ./
          archive_output: false
