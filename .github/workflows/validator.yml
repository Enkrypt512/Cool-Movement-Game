name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  Valdiate_PR_Title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
