name: Pull Request Bot

on:
  issue_comment:
    types: [created]

jobs:
  Handle_Command:
    name: Process Maintainer Command
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            const Comment = context.payload.comment.body.trim();
            const Commenter = context.actor;
            const Repository_Owner = context.repo.owner;
            const Repository_Name = context.repo.repo;
            const Issue_Number = context.issue.number;
            const Valid_Commands = ['/take', '/assign', '/lock', '/unlock', '/close', '/reopen'];
            const First_Word = comment.split(/\s+/)[0].toLowerCase();
            if (!Valid_Commands.includes(First_Word)) {
              return;
            }
            let permissionLevel = 'none';
            try {
              const Permission_Response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: Repository_Owner,
                repo: Repository_Name,
                username: Commenter
              });
              permissionLevel = Permission_Response.data.permission;
            } catch (Error) {
              console.log(`Error checking permission: ${Error.message}`);
            }
            const Allowed_Roles = ['admin', 'write', 'triage'];
            if (!Allowed_Roles.includes(permissionLevel)) {
              await github.rest.issues.createComment({
                owner: Repository_Owner,
                repo: Repository_Name,
                issue_number: Issue_Number,
                body: `Only maintainers and collaborators with write/triage privileges can run \`${firstWord}\`.`
              });
              return;
            }
            const parts = comment.split(/\s+/);

            switch (firstWord) {
              case '/close':
                await github.rest.issues.update({
                  owner: Repository_Owner,
                  repo: Repository_Name,
                  issue_number: Issue_Number,
                  state: 'closed'
                });
                break;

              case '/reopen':
                await github.rest.issues.update({
                  owner: Repository_Owner,
                  repo: Repository_Name,
                  issue_number: Issue_Number,
                  state: 'open'
                });
                break;

              case '/lock':
                await github.rest.issues.lock({
                  owner: Repository_Owner,
                  repo: Repository_Name,
                  issue_number: Issue_Number
                });
                break;

              case '/unlock':
                await github.rest.issues.unlock({
                  owner: Repository_Owner,
                  repo: Repository_Name,
                  issue_number: Issue_Number
                });
                break;

              case '/take':
              case '/assign':
                let targetUser = commenter;
                if (parts.length > 1 && parts[1]) {
                  targetUser = parts[1].replace('@', '');
                }
                try {
                  await github.rest.issues.addAssignees({
                    owner: Repository_Owner,
                    repo: Repository_Name,
                    issue_number: Issue_Number,
                    assignees: [targetUser]
                  });
                } catch (error) {
                  await github.rest.issues.createComment({
                    owner: Repository_Owner,
                    repo: Repository_Name,
                    issue_number: Issue_Number,
                    body: `Could not assign @${targetUser}. Make sure the username is spelled correctly.`
                  });
                }
                break;
            }
